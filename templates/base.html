<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Dashboard · TrendForge AI</title>

<link rel="stylesheet" href="/static/chat.css" />

<!-- PWA SUPPORT (STABLE PATH FIX) -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="app-shell">
  <!-- Left sidebar -->
  <aside class="side glass" id="side">
    <a class="brand" href="/"><span class="brand-dot"></span> TrendForge</a>

    <nav class="side-nav">
      <button class="side-link active" data-view="chat">💬 Chat</button>
      <button class="side-link" data-view="ideas">💡 Ideas</button>
      <button class="side-link" data-view="scripts">🎞 Scripts</button>
      <button class="side-link" data-view="trends">🔥 Trends</button>
      <button class="side-link" data-open-drawer>⚙ Settings</button>
      <a class="side-link danger" href="/logout">↩ Logout</a>
    </nav>

    <div class="side-quote">
      <p id="side-quote">"Show up daily. The algorithm rewards rhythm."</p>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar glass">
      <button class="icon-btn only-mobile" id="toggle-side" aria-label="Menu">☰</button>

      <div>
        <div class="hello" id="hello-line">Hello there 👋</div>
        <div class="muted small" id="hello-sub">Pick a mode and let's create.</div>
      </div>

      <div class="topbar-right">
        <div class="mode-switch">
          <button data-mode="greeting">Greeting</button>
          <button data-mode="normal" class="active">Normal</button>
          <button data-mode="main">Main</button>
        </div>

        <span class="status-pill" id="health-pill">
          <span class="dot"></span> checking…
        </span>

        <button class="icon-btn" data-open-drawer>⚙</button>
      </div>
    </header>

    <section class="chat-area">

      <div class="chat-stream" id="chat-stream">
        <div class="empty-state" id="empty-state">
          <div class="orb"></div>

          <h2 id="empty-greet">Hello, creator</h2>

          <p class="muted">Try one of these to get going:</p>

          <div class="chips">
            <button class="chip">Give me 5 viral TikTok hooks for fitness creators</button>
            <button class="chip">Write a 60-second Shorts script about morning routines</button>
            <button class="chip">Trending hashtags for Nigerian street comedy this week</button>
            <button class="chip">Summarize the top Instagram Reels trends</button>
          </div>
        </div>
      </div>

      <form class="composer glass" id="chat-form">
        <button type="button" class="icon-btn" id="voice-btn">🎙</button>
        <textarea id="chat-input" rows="1" placeholder="Ask TrendForge anything…"></textarea>
        <button type="submit" class="primary-btn">Send</button>
      </form>

    </section>

    <!-- Comments wall -->
    <section class="comments glass">
      <header class="comments-head">
        <h3>Creator Wall</h3>
        <span class="muted small">What other creators are saying</span>
      </header>

      <form id="comment-form" class="comment-form">
        <input type="text" id="comment-input" maxlength="500" placeholder="Share something with other creators…" />
        <button class="primary-btn" type="submit">Post</button>
      </form>

      <ul id="comment-list" class="comment-list"></ul>
    </section>

  </main>

  <!-- Trends sidebar -->
  <aside class="trends glass">
    <header class="trends-head">
      <h3>🔥 Live Trends</h3>
      <button class="ghost-btn xs" id="refresh-trends">Refresh</button>
    </header>

    <div class="trend-cards" id="trend-cards"></div>
  </aside>

</div>

<!-- SCRIPTS -->
<script src="/static/chat.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/service-worker.js')
      .then(() => console.log("PWA Service Worker registered"))
      .catch(err => console.log("SW registration failed", err));
  });
}
</script>

<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log("Install available");
});

function installApp() {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  deferredPrompt.userChoice.then((choice) => {
    if (choice.outcome === "accepted") {
      console.log("User installed app");
    }
    deferredPrompt = null;
  });
}
</script>

<div style="position: fixed; top: 15px; right: 15px; z-index: 9999;">
  <button onclick="installApp()" class="primary-btn">
    Install App
  </button>
</div>

</body>
</html>
